[package]
name = "stilltype"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
base64 = "0.22"
enigo = { version = "0.2", default-features = false, features = ["x11rb", "wayland"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
sha2 = "0.10"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
llama-cpp-2 = { version = "=0.1.160", default-features = false, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.160", default-features = false, features = ["metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# Large model checksums must fit the same startup deadline in debug builds.
[profile.dev.package.sha2]
opt-level = 3
